<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atama Tablosu — Temsilci Atama</title>
  <meta name="description" content="Temsilci-ülke atamalarının tablo görünümü. CSV olarak indirilebilir.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Base Theme Colors */
      --color-bg-page: #f8fafc;
      --color-bg-ocean: #cbd5e1;
      --color-bg-sidebar: rgba(255, 255, 255, 0.95);
      --color-bg-panel: #f8fafc;
      --color-bg-card: #ffffff;
      --color-bg-input: #ffffff;
      
      /* Country & Map Colors */
      --color-map-country-fill: #fefcf6;
      --color-map-country-stroke: #94a3b8;
      --color-map-country-hover-fill: #e2e8f0;
      --color-map-country-hover-stroke: #64748b;

      /* Borders */
      --color-border-subtle: #e2e8f0;
      --color-border-input: #cbd5e1;
      --color-border-hover: #94a3b8;

      /* Typography & Icons */
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-text-inverse: #ffffff;

      /* Primary Actions */
      --color-accent-main: #0f172a;
      --color-accent-hover: #1e293b;
      --color-accent-text: #ffffff;

      /* Badges & Tables */
      --color-badge-bg: #f1f5f9;
      --color-badge-border: #cbd5e1;
      --color-badge-text: #0f172a;
      --color-row-alt: #f8fafc;
      --color-row-hover: #f1f5f9;

      /* Status Colors */
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
      --color-success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background: var(--color-bg-page);
      color: var(--color-text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border-subtle);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border-input);
      border-radius: 10px;
      color: var(--color-text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #back-btn:hover { background: var(--color-row-hover); color: var(--color-text-main); border-color: var(--color-border-hover); }

    header h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--color-text-main);
    }

    #role-badge {
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.2);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-main);
      letter-spacing: 0.05em;
    }

    /* ── Toolbar ── */
    .toolbar {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--color-border-subtle);
      background: var(--color-bg-card);
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border-input);
      border-radius: 10px;
      color: var(--color-text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus { border-color: var(--color-accent-main); box-shadow: 0 0 0 2px rgba(15,23,42,0.1); }
    #search-input::placeholder { color: var(--color-text-muted); }

    #rep-filter {
      width: 100%;
      padding: 10px 14px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border-input);
      border-radius: 10px;
      color: var(--color-text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    #rep-filter:focus { border-color: var(--color-accent-main); box-shadow: 0 0 0 2px rgba(15,23,42,0.1); }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #row-count {
      font-size: 13px;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    #csv-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--color-accent-main);
      border: none;
      border-radius: 10px;
      color: var(--color-accent-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    #csv-btn:hover { background: var(--color-accent-hover); }
    #csv-btn:active { transform: scale(0.97); }
    #csv-btn svg { width: 16px; height: 16px; }

    /* ── Table ── */
    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 0 24px 24px 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--color-text-muted);
      background: var(--color-bg-panel);
      border-bottom: 2px solid var(--color-border-subtle);
      position: sticky;
      top: 0;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--color-text-main); }
    thead th.sort-asc::after { content: ' ▲'; color: var(--color-accent-main); font-size: 9px; }
    thead th.sort-desc::after { content: ' ▼'; color: var(--color-accent-main); font-size: 9px; }

    thead th:first-child { border-radius: 10px 0 0 0; width: 60px; text-align: center; }
    thead th:last-child  { border-radius: 0 10px 0 0; }

    tbody tr {
      border-bottom: 1px solid var(--color-border-subtle);
      transition: background 0.12s;
    }
    tbody tr:nth-child(even) { background: var(--color-bg-card); }
    tbody tr:nth-child(odd) { background: var(--color-row-alt); }
    tbody tr:hover { background: var(--color-row-hover); }

    td {
      padding: 12px 16px;
      font-size: 14px;
      vertical-align: middle;
    }
    td:first-child { text-align: center; color: var(--color-text-muted); font-size: 12px; font-weight: 600; }

    .rep-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 0 6px var(--dot-color, transparent);
    }

    .country-code-badge {
      display: inline-block;
      padding: 3px 8px;
      background: var(--color-badge-bg);
      border: 1px solid var(--color-badge-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--color-badge-text);
      font-family: 'Courier New', monospace;
    }

    /* ── Empty / Loading states ── */
    #loading-state, #empty-state, #auth-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 24px;
      color: var(--color-text-muted);
      font-size: 15px;
    }
    #loading-state.visible, #empty-state.visible, #auth-state.visible { display: flex; }

    .state-icon {
      width: 56px;
      height: 56px;
      opacity: 0.3;
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--color-border-subtle);
      border-top-color: var(--color-accent-main);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 0 14px; }
      header h1 { font-size: 15px; }
      .toolbar { padding: 12px 14px; }
      .table-wrap { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/" id="back-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Haritaya Dön
      </a>
      <h1>Atama Tablosu</h1>
      <span id="role-badge">YÜKLENİYOR...</span>
    </div>
    <div style="font-size: 11px; color: var(--color-text-muted); font-weight: 500;">
      GNNlabs
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1016.65 16.65z"/></svg>
      <input type="text" id="search-input" placeholder="Temsilci veya ülke ara...">
    </div>
    <div style="min-width: 180px;">
      <select id="rep-filter">
        <option value="ALL">Tüm Temsilciler</option>
      </select>
    </div>
    <div class="toolbar-right">
      <span id="row-count">0 kayıt</span>
      <button id="csv-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        CSV Olarak İndir
      </button>
    </div>
  </div>

  <div id="loading-state" class="visible">
    <div class="spinner"></div>
    <span>Veriler yükleniyor...</span>
  </div>

  <div id="auth-state">
    <svg class="state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
    <span>Bu sayfayı görüntülemek için giriş yapmalısınız. <a href="/" style="color: var(--color-accent-main); text-decoration: underline;">Giriş Yap</a></span>
  </div>

  <div id="empty-state">
    <svg class="state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
    <span>Arama kriterlerine uygun atama bulunamadı.</span>
  </div>

  <div class="table-wrap">
    <table id="data-table" style="display:none;">
      <thead>
        <tr>
          <th style="width: 50px;">No</th>
          <th data-sort="rep_name">Temsilci Adı</th>
          <th data-sort="country_code" style="width: 100px;">Ülke Kodu</th>
          <th data-sort="country_name">Ülke Adı</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module" src="/src/table.ts"></script>
</body>
</html>
