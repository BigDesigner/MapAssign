<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atama Tablosu — Temsilci Atama</title>
  <meta name="description" content="Temsilci-ülke atamalarının tablo görünümü. CSV olarak indirilebilir.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: rgba(17, 24, 39, 0.85);
      --surface-solid: #111827;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --row-hover: rgba(59,130,246,0.06);
      --row-alt: rgba(255,255,255,0.015);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11,15,25,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: var(--border-hover); }

    header h1 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #role-badge {
      padding: 4px 10px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.05em;
    }

    /* ── Toolbar ── */
    .toolbar {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.4);
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    #search-input::placeholder { color: var(--text-muted); }

    #rep-filter {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    #rep-filter:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #row-count {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    #csv-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--success);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    #csv-btn:hover { background: #059669; }
    #csv-btn:active { transform: scale(0.97); }
    #csv-btn svg { width: 16px; height: 16px; }

    /* ── Table ── */
    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 0 24px 24px 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      background: var(--surface-solid);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--text); }
    thead th.sort-asc::after { content: ' ▲'; color: var(--accent); font-size: 9px; }
    thead th.sort-desc::after { content: ' ▼'; color: var(--accent); font-size: 9px; }

    thead th:first-child { border-radius: 10px 0 0 0; width: 60px; text-align: center; }
    thead th:last-child  { border-radius: 0 10px 0 0; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); }

    td {
      padding: 12px 16px;
      font-size: 14px;
      vertical-align: middle;
    }
    td:first-child { text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 600; }

    .rep-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 6px var(--dot-color, transparent);
    }

    .country-code-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-family: 'Courier New', monospace;
    }

    /* ── Empty / Loading states ── */
    #loading-state, #empty-state, #auth-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 24px;
      color: var(--text-muted);
      font-size: 15px;
    }
    #loading-state.visible, #empty-state.visible, #auth-state.visible { display: flex; }

    .state-icon {
      width: 56px;
      height: 56px;
      opacity: 0.3;
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 0 14px; }
      header h1 { font-size: 15px; }
      .toolbar { padding: 12px 14px; }
      .table-wrap { padding: 12px; }
      td, thead th { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-left">
      <a id="back-btn" href="/">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:16px;height:16px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Haritaya Dön
      </a>
      <h1>Atama Tablosu</h1>
      <span id="role-badge">—</span>
    </div>
    <button id="csv-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      CSV Olarak İndir
    </button>
  </header>

  <!-- Toolbar -->
  <div class="toolbar" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <div class="search-wrap" style="flex: 2; min-width: 200px;">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1016.65 16.65z"/>
      </svg>
      <input type="text" id="search-input" placeholder="Temsilci veya ülke ara...">
    </div>
    <div class="filter-wrap" style="flex: 1; min-width: 160px;">
      <select id="rep-filter">
        <option value="">Tüm Temsilciler</option>
      </select>
    </div>
    <div class="toolbar-right" style="flex-shrink: 0; margin-left: auto;">
      <span id="row-count">—</span>
    </div>
  </div>

  <!-- Auth error state -->
  <div id="auth-state">
    <svg class="state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/>
    </svg>
    <p>Oturum bulunamadı. Lütfen <a href="/" style="color:var(--accent)">giriş yapın</a>.</p>
  </div>

  <!-- Loading state -->
  <div id="loading-state" class="visible">
    <div class="spinner"></div>
    <p>Veriler yükleniyor...</p>
  </div>

  <!-- Empty state -->
  <div id="empty-state">
    <svg class="state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0H4"/>
    </svg>
    <p>Arama kriterlerine uygun kayıt bulunamadı.</p>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="table-wrap" style="display:none;">
    <table id="data-table">
      <thead>
        <tr>
          <th data-col="no">No</th>
          <th data-col="rep" class="sort-asc">Temsilci Adı</th>
          <th data-col="code">Ülke Kodu</th>
          <th data-col="name">Ülke Adı</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module">
    import { COUNTRY_NAMES } from './src/countryNames.ts';

    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? '' : 'https://map-api.akansu.com';

    function apiFetch(path, init = {}) {
      init.credentials = 'include';
      return fetch(API_BASE + path, init);
    }

    // ── State ──
    let allRows = [];      // { no, rep, code, name, color }
    let filtered = [];
    let sortCol = 'rep';
    let sortDir = 1;       // 1 = asc, -1 = desc
    let role = null;

    // ── DOM refs ──
    const tbody         = document.getElementById('table-body');
    const searchInput   = document.getElementById('search-input');
    const rowCount      = document.getElementById('row-count');
    const loadingState  = document.getElementById('loading-state');
    const emptyState    = document.getElementById('empty-state');
    const authState     = document.getElementById('auth-state');
    const tableWrap     = document.getElementById('table-wrap');
    const csvBtn        = document.getElementById('csv-btn');
    const roleBadge     = document.getElementById('role-badge');
    const repFilter     = document.getElementById('rep-filter');

    function showState(which) {
      loadingState.classList.toggle('visible', which === 'loading');
      emptyState.classList.toggle('visible', which === 'empty');
      authState.classList.toggle('visible', which === 'auth');
      tableWrap.style.display = which === 'table' ? 'block' : 'none';
    }

    // ── Fetch data ──
    async function loadData() {
      showState('loading');
      try {
        // Fetch current user details to check authentication and role
        const meRes = await apiFetch('/api/auth/me');
        if (meRes.status === 401) {
          showState('auth');
          return;
        }
        if (!meRes.ok) {
          showState('auth');
          return;
        }
        const meData = await meRes.json();
        role = meData.role; // 'admin' or 'representative'

        if (role === 'admin') {
          roleBadge.textContent = 'YÖNETİCİ';
          roleBadge.style.color = '#38bdf8'; // sky-400
          roleBadge.style.borderColor = 'rgba(56,189,248,0.3)';
          roleBadge.style.background = 'rgba(56,189,248,0.1)';
        } else {
          roleBadge.textContent = 'TEMSİLCİ';
          roleBadge.style.color = '#a3e635'; // lime-400
          roleBadge.style.borderColor = 'rgba(163,230,53,0.3)';
          roleBadge.style.background = 'rgba(163,230,53,0.1)';
        }

        // Fetch all assignments for map state (accessible to both roles now)
        const res = await apiFetch('/api/map/state');
        if (!res.ok) {
          showState('auth');
          return;
        }
        const data = await res.json();
        const assignments = data.assignments || [];
        
        // Group by rep name then sort using Turkish localeCompare
        const sorted = [...assignments].sort((a, b) =>
          String(a.name).localeCompare(String(b.name), 'tr') ||
          String(COUNTRY_NAMES[a.country_code] || a.country_code).localeCompare(
            COUNTRY_NAMES[b.country_code] || b.country_code, 'tr')
        );
        allRows = sorted.map((row, i) => ({
          no: i + 1,
          rep: row.name,
          code: (row.country_code || '').toLowerCase(),
          name: COUNTRY_NAMES[(row.country_code || '').toLowerCase()] || (row.country_code || '').toUpperCase(),
          color: row.color_hex,
        }));
      } catch (e) {
        console.error(e);
        showState('auth');
        return;
      }
      populateRepFilter();
      applyFilter();
    }

    // ── Filter ──
    function populateRepFilter() {
      const reps = [...new Set(allRows.map(r => r.rep))].sort((a, b) => a.localeCompare(b, 'tr'));
      const currentVal = repFilter.value;
      repFilter.innerHTML = '<option value="">Tüm Temsilciler</option>' +
        reps.map(r => `<option value="${escHtml(r)}">${escHtml(r)}</option>`).join('');
      if (reps.includes(currentVal)) {
        repFilter.value = currentVal;
      }
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const repVal = repFilter.value;
      
      filtered = allRows.filter(r => {
        const matchesSearch = !q || (
          r.rep.toLowerCase().includes(q) ||
          r.name.toLowerCase().includes(q) ||
          r.code.includes(q)
        );
        const matchesRep = !repVal || r.rep === repVal;
        return matchesSearch && matchesRep;
      });
      applySort();
    }

    // ── Sort ──
    function applySort() {
      filtered.sort((a, b) => {
        const va = sortCol === 'no' ? a.no : String(a[sortCol]);
        const vb = sortCol === 'no' ? b.no : String(b[sortCol]);
        if (sortCol === 'no') return sortDir * (va - vb);
        return sortDir * va.localeCompare(vb, 'en');
      });
      renderTable();
    }

    // ── Render ──
    function renderTable() {
      rowCount.textContent = `${filtered.length} kayıt`;

      if (!filtered.length) {
        if (allRows.length === 0) {
          showState('empty');
        } else {
          showState('empty');
        }
        return;
      }

      showState('table');

      tbody.innerHTML = filtered.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>
            <div class="rep-name-cell">
              <div class="color-dot" style="background:${r.color}; --dot-color:${r.color};"></div>
              ${escHtml(r.rep)}
            </div>
          </td>
          <td><span class="country-code-badge">${escHtml(r.code.toUpperCase())}</span></td>
          <td>${escHtml(r.name)}</td>
        </tr>
      `).join('');
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── CSV Export ──
    csvBtn.addEventListener('click', () => {
      if (!filtered.length) return;
      const header = ['No', 'Temsilci Adı', 'Ülke Kodu', 'Ülke Adı'];
      const rows = filtered.map((r, i) => [
        i + 1,
        `"${r.rep.replace(/"/g,'""')}"`,
        r.code.toUpperCase(),
        `"${r.name.replace(/"/g,'""')}"`
      ]);
      const csv = [header, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `assignments_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // ── Search & Filter ──
    searchInput.addEventListener('input', applyFilter);
    repFilter.addEventListener('change', applyFilter);

    // ── Sort header clicks ──
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) {
          sortDir *= -1;
        } else {
          sortCol = col;
          sortDir = 1;
        }
        document.querySelectorAll('thead th').forEach(h => {
          h.classList.remove('sort-asc','sort-desc');
        });
        th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
        applySort();
      });
    });

    // ── Init ──
    loadData();
  </script>
</body>
</html>
